[package]
name = "curriculum-deploy"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/curriculum-deploy"
description = "Curriculum data deployment runtime."
publish = false

[[bin]]
name = "curriculum-deploy"
path = "src/main.rs"

[dependencies]
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "e4430bfe" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "56c683ec8d1e" }
thiserror = "2"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "8bcb0b9402fb" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
