[package]
name = "curriculum-deploy"
version = "0.10.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/curriculum-deploy"
description = "Curriculum data deployment runtime."
publish = false

[features]
default = ["datom"]
datom = []

[[bin]]
name = "curriculum-deploy"
path = "src/main.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", features = ["rkyv"] }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
# The Curriculum Nexus's wire: what a role projection asks and is answered.
signal-curriculum-nexus = { git = "https://github.com/LiGoldragon/signal-curriculum-nexus", rev = "4358aa1", features = ["datom"] }
# Curriculum's roles file format, RolesDocument, declared in its curriculum.ethos.
curriculum = { git = "https://github.com/LiGoldragon/Curriculum", rev = "1b6c454", default-features = false, features = ["datom"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sha2 = "=0.10.9"
thiserror = "2"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "8c95310" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
