[package]
name = "curriculum-deploy"
version = "0.5.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/curriculum-deploy"
description = "Curriculum data deployment runtime."
publish = false

[[bin]]
name = "curriculum-deploy"
path = "src/main.rs"

[dependencies]
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "4712361c0194" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "48061367872b" }
thiserror = "2"

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "0f198968d208" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
